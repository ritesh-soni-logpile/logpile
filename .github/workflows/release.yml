name: Release Logpile Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows .exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile frontend bundle (Vite)
        run: npm run build

      - name: Package Windows executable (electron-builder)
        run: npm run dist -- --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: logpile-windows-installer
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to itch.io via Butler
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if (-not $env:BUTLER_API_KEY) {
            Write-Host "::warning::BUTLER_API_KEY secret not found or empty. Skipping itch.io push."
            exit 0
          }
          Write-Host "Downloading itch.io Butler CLI..."
          curl.exe -L -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          tar -xf butler.zip
          $installer = (Get-ChildItem -Path "dist" -Filter "Logpile.Setup.*.exe" | Select-Object -First 1).FullName
          $portable = (Get-ChildItem -Path "dist" -Filter "Logpile-*-win.zip" | Select-Object -First 1).FullName
          if ($installer) {
            Write-Host "Pushing installer build to itch.io: $installer"
            .\butler.exe push "$installer" logpile/logpile:windows-installer --userversion "${{ github.ref_name }}"
          }
          if ($portable) {
            Write-Host "Pushing portable zip to itch.io: $portable"
            .\butler.exe push "$portable" logpile/logpile:windows-portable --userversion "${{ github.ref_name }}"
          }
